name: CI / Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node test.js

  deploy:
    # Only main is published, and only when the tests pass.
    # This needs Settings -> Pages -> Source = "GitHub Actions". While Pages still builds from the
    # branch, GitHub deploys every push itself and a second deployment here only collides with it,
    # so the job then skips the deployment with a notice.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type || echo unknown)
          echo "type=$type" >> "$GITHUB_OUTPUT"
          if [ "$type" != "workflow" ]; then
            echo "::notice::Pages builds from the branch ($type), so GitHub deploys every push itself. Set Settings > Pages > Source to 'GitHub Actions' to deploy only after the tests pass."
          fi
      - if: steps.source.outputs.type == 'workflow'
        uses: actions/checkout@v7
      - if: steps.source.outputs.type == 'workflow'
        uses: actions/configure-pages@v6
      - if: steps.source.outputs.type == 'workflow'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - if: steps.source.outputs.type == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v5
